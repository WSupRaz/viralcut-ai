name: E2E

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Docker info
        run: docker version --format 'server={{.Server.Version}}' && docker compose version

      - name: Build images
        run: docker compose -f infra/docker-compose.dev.yml build api worker render-worker

      - name: Boot the stack (postgres, redis, minio, api, worker)
        id: boot
        run: |
          set +e
          docker compose -f infra/docker-compose.dev.yml up -d \
            postgres redis minio minio-init api worker render-worker > /tmp/boot.log 2>&1
          RC=$?
          docker compose -f infra/docker-compose.dev.yml ps >> /tmp/boot.log 2>&1
          echo "RC=$RC" >> /tmp/boot.log
          cat /tmp/boot.log
          exit $RC

      # The Actions logs API needs repo-admin, so on failure mirror the boot
      # output as a public check-run annotation (readable via the checks API).
      - name: Publish boot diagnostics
        if: failure() && steps.boot.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = open('/tmp/boot.log', errors='replace').read()[-4000:]
          body = json.dumps({
              "name": "boot-diagnostics",
              "head_sha": "${{ github.sha }}",
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "docker compose up failed", "summary": "```\n" + log + "\n```"},
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/check-runs",
              data=body, method="POST",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(urllib.request.urlopen(req).status)
          PY

      - name: Wait for API health (api auto-migrates on boot)
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "api healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "api never became healthy" >&2
          docker compose -f infra/docker-compose.dev.yml logs api --tail 40 >&2 || true
          exit 1

      - name: Generate test videos (worker container has ffmpeg)
        id: videos
        run: |
          set +e
          bash tests/e2e/scripts/make-test-video.sh > /tmp/video.log 2>&1
          RC=$?
          echo "RC=$RC" >> /tmp/video.log
          docker compose -f infra/docker-compose.dev.yml ps worker >> /tmp/video.log 2>&1
          docker compose -f infra/docker-compose.dev.yml logs --tail 30 worker >> /tmp/video.log 2>&1
          cat /tmp/video.log
          exit $RC

      - name: Publish video diagnostics
        if: failure() && steps.videos.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = open('/tmp/video.log', errors='replace').read()[-4000:]
          body = json.dumps({
              "name": "video-diagnostics",
              "head_sha": "${{ github.sha }}",
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "test-video generation failed", "summary": "```\n" + log + "\n```"},
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/check-runs",
              data=body, method="POST",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(urllib.request.urlopen(req).status)
          PY

      - name: Validation suite
        run: |
          pip install --quiet httpx
          python tests/e2e/api/e2e_validation.py --api http://localhost:8000

      - name: API upload suite (real clip through proxy job)
        id: apisuite
        run: |
          set +e
          python tests/e2e/api/e2e_upload.py tests/e2e/artifacts/ci-real.mp4 --api http://localhost:8000 > /tmp/apisuite.log 2>&1
          RC=$?
          echo "RC=$RC" >> /tmp/apisuite.log
          docker compose -f infra/docker-compose.dev.yml logs --tail 40 worker >> /tmp/apisuite.log 2>&1
          cat /tmp/apisuite.log
          exit $RC

      - name: Publish API-suite diagnostics
        if: failure() && steps.apisuite.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = open('/tmp/apisuite.log', errors='replace').read()[-4000:]
          body = json.dumps({
              "name": "apisuite-diagnostics",
              "head_sha": "${{ github.sha }}",
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "api upload suite failed", "summary": "```\n" + log + "\n```"},
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/check-runs",
              data=body, method="POST",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(urllib.request.urlopen(req).status)
          PY

      - name: Build and serve the web app
        id: webapp
        run: |
          set +e
          (
            cd apps/web
            printf 'NEXT_PUBLIC_API_URL=http://localhost:8000\n' > .env.local
            npm ci --no-audit --no-fund
            npm run build
          ) > /tmp/webbuild.log 2>&1
          RC=$?
          if [ $RC -eq 0 ]; then
            cd apps/web
            nohup npx next start -p 3000 > /tmp/web.log 2>&1 &
            for i in $(seq 1 60); do
              if curl -sf http://localhost:3000/sign-up >/dev/null 2>&1; then
                echo "web serving after ${i} attempts"
                exit 0
              fi
              sleep 2
            done
            echo "web never became healthy" >&2
            RC=1
          fi
          cat /tmp/webbuild.log
          tail -40 /tmp/web.log 2>/dev/null || true
          exit $RC

      - name: Publish web-build diagnostics
        if: failure() && steps.webapp.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = (open('/tmp/webbuild.log', errors='replace').read() + open('/tmp/web.log', errors='replace').read())[-4000:]
          body = json.dumps({
              "name": "webapp-diagnostics",
              "head_sha": "${{ github.sha }}",
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "web build/start failed", "summary": "```\n" + log + "\n```"},
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/check-runs",
              data=body, method="POST",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(urllib.request.urlopen(req).status)
          PY

      - name: Client E2E (real upload client vs live stack)
        id: client
        run: |
          set +e
          cd apps/web && npx tsx ../../tests/e2e/client/upload-client.e2e.mts > /tmp/client.log 2>&1
          RC=$?
          cat /tmp/client.log
          exit $RC

      - name: Publish client diagnostics
        if: failure() && steps.client.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = open('/tmp/client.log', errors='replace').read()[-4000:]
          body = json.dumps({
              "name": "client-diagnostics",
              "head_sha": "${{ github.sha }}",
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "client e2e failed", "summary": "```\n" + log + "\n```"},
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/check-runs",
              data=body, method="POST",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(urllib.request.urlopen(req).status)
          PY

      - name: Browser E2E (upload -> refresh -> resume)
        id: browser
        run: |
          set +e
          (
            cd tests/e2e/browser
            npm ci --no-audit --no-fund
            npx playwright install --with-deps chromium
            PW_CHANNEL=chromium E2E_UPLOAD_MBPS=10 \
              node upload-resume.mjs ../artifacts/ci-upload-100mb.mp4
          ) > /tmp/browser.log 2>&1
          RC=$?
          cat /tmp/browser.log
          exit $RC

      - name: Publish browser diagnostics
        if: failure() && steps.browser.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          log = open('/tmp/browser.log', errors='replace').read()[-4000:]
          body = json.dumps({
              "name": "browser-diagnostics",
              "head_sha": "${{ github.sha }}",
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": "browser e2e failed", "summary": "```\n" + log + "\n```"},
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/check-runs",
              data=body, method="POST",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(urllib.request.urlopen(req).status)
          PY

      - name: Upload logs on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.dev.yml ps -a > /tmp/ps.log 2>&1 || true
          docker compose -f infra/docker-compose.dev.yml logs --tail 80 > /tmp/stack.log 2>&1 || true
          echo "--- docker ps ---"; cat /tmp/ps.log
          echo "--- compose logs ---"; tail -120 /tmp/stack.log
          echo "--- web log ---"; cat /tmp/web.log 2>/dev/null || true
